<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#F5F7FA">

  <meta
    name="description"
    content="ふたりで使う家計簿 Family Dashboard"
  >

  <title>ふたりの家計簿</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    rel="stylesheet"
  >

</head>


<body>


<!-- =====================================================
     APP
===================================================== -->

<main class="app">


  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <div class="header-main">

      <p
        class="hello"
        id="greeting"
      >
        ☀️ おはよう、市川さん
      </p>

      <h1>
        ふたりの家計簿
      </h1>

      <span
        class="month"
        id="currentMonth"
      >
        ----年--月
      </span>

    </div>


    <button
      class="bell"
      id="notificationButton"
      type="button"
      aria-label="お知らせ"
    >

      <span class="material-symbols-rounded">
        notifications
      </span>

    </button>

  </header>



  <!-- ===================================================
       今月の生活費
  ==================================================== -->

  <section class="card summary-card living-card">

    <div class="summary-header">

      <div>

        <p class="card-title">
          🏠 今月の生活費
        </p>

        <h2 id="totalMoney">
          ¥0
        </h2>

      </div>


      <div
        class="summary-percent"
        id="budgetPercent"
      >
        0%
      </div>

    </div>


    <div
      class="progress"
      id="budgetProgress"
      role="progressbar"
      aria-label="生活費予算使用率"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>


    <div class="budget-row">

      <div class="budget-item">

        <span class="budget-label">
          予算
        </span>

        <strong id="budgetMoney">
          ¥250,000
        </strong>

      </div>


      <div class="budget-item budget-item-right">

        <span class="budget-label">
          残り
        </span>

        <strong id="balanceMoney">
          ¥250,000
        </strong>

      </div>

    </div>

  </section>



  <!-- ===================================================
       今月の貯蓄
  ==================================================== -->

  <section class="saving-summary">

    <div class="saving-summary-icon">

      <span class="material-symbols-rounded">
        savings
      </span>

    </div>


    <div class="saving-summary-content">

      <span class="saving-summary-label">
        💰 今月の貯蓄
      </span>

      <strong id="savingActual">
        ¥250,000
      </strong>

      <p>
        生活費の残金を自動で貯蓄
      </p>

    </div>

  </section>



  <!-- ===================================================
       夫婦の負担
  ==================================================== -->

  <section class="contribution-card">

    <div class="contribution-header">

      <div>

        <span class="contribution-caption">
          今月の生活費
        </span>

        <h3>
          ふたりの負担
        </h3>

      </div>


      <strong
        class="contribution-total"
        id="contributionTotal"
      >
        ¥250,000
      </strong>

    </div>


    <div class="contribution-members">


      <div class="contribution-member">

        <div class="member-left">

          <span class="member-avatar">
            👨
          </span>

          <span>
            さとる
          </span>

        </div>

        <strong id="satoruContribution">
          ¥150,000
        </strong>

      </div>


      <div class="contribution-member">

        <div class="member-left">

          <span class="member-avatar">
            👩
          </span>

          <span>
            かな
          </span>

        </div>

        <strong id="kanaContribution">
          ¥100,000
        </strong>

      </div>


    </div>

  </section>



  <!-- ===================================================
       CATEGORY
  ==================================================== -->

  <section class="card category-card">

    <div class="section-header">

      <div>

        <p class="card-title">
          カテゴリ
        </p>

        <h3>
          生活費の内訳
        </h3>

      </div>


      <button
        class="text-button"
        id="categoryDetailButton"
        type="button"
      >
        すべて見る
      </button>

    </div>


    <div
      class="category-list"
      id="categoryList"
    >

      <div class="loading-row">

        <span class="loading-dot"></span>

        <span>
          読み込み中...
        </span>

      </div>

    </div>

  </section>



  <!-- ===================================================
       AI
  ==================================================== -->

  <section class="card ai-card">

    <div class="ai-header">

      <div class="ai-icon">

        <span class="material-symbols-rounded">
          auto_awesome
        </span>

      </div>


      <div>

        <p class="card-title">
          AIアドバイス
        </p>

        <h3>
          今月の家計
        </h3>

      </div>

    </div>


    <p
      class="ai-text"
      id="aiAdvice"
    >
      家計データを読み込んでいます...
    </p>

  </section>



  <!-- ===================================================
       RECENT
  ==================================================== -->

  <section class="card receipt-card">

    <div class="section-header">

      <div>

        <p class="card-title">
          最近のレシート
        </p>

        <h3>
          最新の支出
        </h3>

      </div>


      <button
        class="text-button"
        id="receiptDetailButton"
        type="button"
      >
        すべて見る
      </button>

    </div>


    <div
      class="recent-list"
      id="recentList"
    >

      <div class="loading-row">

        <span class="loading-dot"></span>

        <span>
          読み込み中...
        </span>

      </div>

    </div>

  </section>



  <!-- ===================================================
       UPDATE
  ==================================================== -->

  <div class="update-status">

    <span class="material-symbols-rounded update-icon">
      sync
    </span>

    <span id="lastUpdated">
      データを取得しています
    </span>

  </div>


  <div class="bottom-space"></div>


</main>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav
  class="bottom-nav"
  aria-label="メインメニュー"
>


  <button
    class="nav-button active"
    type="button"
    data-page="home"
    aria-label="ホーム"
  >

    <span class="material-symbols-rounded">
      home
    </span>

    <span class="nav-label">
      ホーム
    </span>

  </button>



  <button
    class="nav-button"
    type="button"
    data-page="receipt"
    aria-label="レシート"
  >

    <span class="material-symbols-rounded">
      receipt_long
    </span>

    <span class="nav-label">
      レシート
    </span>

  </button>



  <button
    class="nav-button"
    type="button"
    data-page="report"
    aria-label="レポート"
  >

    <span class="material-symbols-rounded">
      donut_large
    </span>

    <span class="nav-label">
      レポート
    </span>

  </button>



  <button
    class="nav-button"
    type="button"
    data-page="calendar"
    aria-label="カレンダー"
  >

    <span class="material-symbols-rounded">
      calendar_month
    </span>

    <span class="nav-label">
      カレンダー
    </span>

  </button>



  <button
    class="nav-button"
    type="button"
    data-page="settings"
    aria-label="設定"
  >

    <span class="material-symbols-rounded">
      settings
    </span>

    <span class="nav-label">
      設定
    </span>

  </button>

</nav>



<!-- =====================================================
     ERROR
===================================================== -->

<div
  class="toast"
  id="errorToast"
  role="alert"
  aria-live="polite"
>

  <span class="material-symbols-rounded">
    error
  </span>

  <span id="errorMessage">
    エラーが発生しました
  </span>

</div>



<script src="js/app.js"></script>


</body>
</html>
