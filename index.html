<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#F5F7FA">

  <meta
    name="description"
    content="ふたりで使う、シンプルでかわいい家計簿"
  >

  <title>ふたりの家計簿</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    rel="stylesheet"
  >
</head>


<body>

  <!-- ========================================
       APP
  ========================================= -->

  <main class="app">


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">

      <div class="header-main">

        <p class="hello" id="greeting">
          ☀️ おはよう、市川さん
        </p>

        <h1>
          ふたりの家計簿
        </h1>

        <span class="month" id="currentMonth">
          ----年--月
        </span>

      </div>


      <button
        class="bell"
        id="notificationButton"
        type="button"
        aria-label="お知らせ"
      >

        <span class="material-symbols-rounded">
          notifications
        </span>

      </button>

    </header>



    <!-- ========================================
         MONTHLY EXPENSE
    ========================================= -->

    <section class="card summary-card">

      <div class="summary-header">

        <div>

          <p class="card-title">
            今月の支出
          </p>

          <h2 id="totalMoney">
            ¥0
          </h2>

        </div>


        <div
          class="summary-percent"
          id="budgetPercent"
        >
          0%
        </div>

      </div>


      <!-- Progress -->

      <div
        class="progress"
        role="progressbar"
        aria-label="今月の予算使用率"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="budgetProgress"
      >

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>


      <!-- Budget -->

      <div class="budget-row">

        <div class="budget-item">

          <span class="budget-label">
            予算
          </span>

          <strong id="budgetMoney">
            ¥0
          </strong>

        </div>


        <div class="budget-item budget-item-right">

          <span class="budget-label">
            残り
          </span>

          <strong id="balanceMoney">
            ¥0
          </strong>

        </div>

      </div>

    </section>



    <!-- ========================================
         CATEGORY
    ========================================= -->

    <section class="card category-card">

      <div class="section-header">

        <div>

          <p class="card-title">
            カテゴリ
          </p>

          <h3>
            今月の内訳
          </h3>

        </div>


        <button
          class="text-button"
          id="categoryDetailButton"
          type="button"
        >
          すべて見る
        </button>

      </div>


      <!--
        app.js がここへカテゴリを自動生成する

        例:

        🍚 食費      ¥3,500
        █████░░░░░
      -->

      <div
        class="category-list"
        id="categoryList"
      >

        <div class="loading-row">

          <span class="loading-dot"></span>

          <span>
            読み込み中...
          </span>

        </div>

      </div>

    </section>



    <!-- ========================================
         AI ADVICE
    ========================================= -->

    <section class="card ai-card">

      <div class="ai-header">

        <div class="ai-icon">

          <span class="material-symbols-rounded">
            auto_awesome
          </span>

        </div>


        <div>

          <p class="card-title">
            AIアドバイス
          </p>

          <h3>
            今月の家計
          </h3>

        </div>

      </div>


      <p
        class="ai-text"
        id="aiAdvice"
      >
        家計データを読み込んでいます...
      </p>

    </section>



    <!-- ========================================
         RECENT RECEIPTS
    ========================================= -->

    <section class="card receipt-card">

      <div class="section-header">

        <div>

          <p class="card-title">
            最近のレシート
          </p>

          <h3>
            最新の支出
          </h3>

        </div>


        <button
          class="text-button"
          id="receiptDetailButton"
          type="button"
        >
          すべて見る
        </button>

      </div>


      <!--
        app.js がここへレシートを自動生成する

        例:

        OKストア
        🍚 食費
        9/1             ¥3,500
      -->

      <div
        class="recent-list"
        id="recentList"
      >

        <div class="loading-row">

          <span class="loading-dot"></span>

          <span>
            読み込み中...
          </span>

        </div>

      </div>

    </section>



    <!-- ========================================
         UPDATE STATUS
    ========================================= -->

    <div class="update-status">

      <span
        class="material-symbols-rounded update-icon"
      >
        sync
      </span>

      <span id="lastUpdated">
        データを取得しています
      </span>

    </div>


    <!-- Bottom nav分の余白 -->

    <div class="bottom-space"></div>

  </main>



  <!-- ========================================
       BOTTOM NAVIGATION
  ========================================= -->

  <nav
    class="bottom-nav"
    aria-label="メインメニュー"
  >


    <!-- Home -->

    <button
      class="nav-button active"
      type="button"
      data-page="home"
      aria-label="ホーム"
    >

      <span class="material-symbols-rounded">
        home
      </span>

      <span class="nav-label">
        ホーム
      </span>

    </button>



    <!-- Receipt -->

    <button
      class="nav-button"
      type="button"
      data-page="receipt"
      aria-label="レシート"
    >

      <span class="material-symbols-rounded">
        receipt_long
      </span>

      <span class="nav-label">
        レシート
      </span>

    </button>



    <!-- Report -->

    <button
      class="nav-button"
      type="button"
      data-page="report"
      aria-label="レポート"
    >

      <span class="material-symbols-rounded">
        donut_large
      </span>

      <span class="nav-label">
        レポート
      </span>

    </button>



    <!-- Calendar -->

    <button
      class="nav-button"
      type="button"
      data-page="calendar"
      aria-label="カレンダー"
    >

      <span class="material-symbols-rounded">
        calendar_month
      </span>

      <span class="nav-label">
        カレンダー
      </span>

    </button>



    <!-- Settings -->

    <button
      class="nav-button"
      type="button"
      data-page="settings"
      aria-label="設定"
    >

      <span class="material-symbols-rounded">
        settings
      </span>

      <span class="nav-label">
        設定
      </span>

    </button>

  </nav>



  <!-- ========================================
       ERROR TOAST
  ========================================= -->

  <div
    class="toast"
    id="errorToast"
    role="alert"
    aria-live="polite"
  >

    <span class="material-symbols-rounded">
      error
    </span>

    <span id="errorMessage">
      データを取得できませんでした
    </span>

  </div>



  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script src="js/app.js"></script>

</body>
</html>
