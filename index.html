<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ふたりの家計簿</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div>
            <p class="hello">☀️ おはよう、市川さん</p>
            <h1>ふたりの家計簿</h1>
            <span class="month">2026年9月</span>
        </div>

        <button class="bell">
            <span class="material-symbols-rounded">
                notifications
            </span>
        </button>

    </header>

    <!-- 支出 -->
    <section class="card">

        <p class="card-title">今月の支出</p>

        <h2 id="totalMoney">¥0</h2>

        <div class="progress">

            <div class="progress-bar"></div>

        </div>

        <div class="budget-row">

            <span>予算 ¥300,000</span>

            <span>残り ¥300,000</span>

        </div>

    </section>

    <!-- カテゴリ -->
    <section class="card">

        <div class="category">
            <span>🍚 食費</span>
            <strong>¥0</strong>
        </div>

        <div class="category">
            <span>🍜 外食</span>
            <strong>¥0</strong>
        </div>

        <div class="category">
            <span>🛒 日用品</span>
            <strong>¥0</strong>
        </div>

        <div class="category">
            <span>🚗 交通費</span>
            <strong>¥0</strong>
        </div>

    </section>

    <!-- AI -->
    <section class="card">

        <p class="card-title">

            🤖 AIアドバイス

        </p>

        <p class="ai-text">

            今月の家計データが集まると、
            AIが自動で分析します。

        </p>

    </section>

    <!-- レシート -->
    <section class="card">

        <p class="card-title">

            最近のレシート

        </p>

        <div class="receipt">

            <span>まだ登録されていません</span>

        </div>

    </section>

</div>

<!-- Bottom Navigation -->

<nav class="bottom-nav">

<button class="active">

<span class="material-symbols-rounded">

home

</span>

</button>

<button>

<span class="material-symbols-rounded">

receipt_long

</span>

</button>

<button>

<span class="material-symbols-rounded">

pie_chart

</span>

</button>

<button>

<span class="material-symbols-rounded">

calendar_month

</span>

</button>

<button>

<span class="material-symbols-rounded">

settings

</span>

</button>

</nav>

<script src="js/app.js"></script>

</body>
</html>
